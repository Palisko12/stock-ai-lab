name: Stock AI Research Snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance==0.2.65 numpy==2.2.6 pandas==2.3.3
      - run: python research_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-research-snapshot
          path: research_output/
          if-no-files-found: warn
