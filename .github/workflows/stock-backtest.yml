name: Stock Historical Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance==0.2.65 numpy==2.2.6 pandas==2.3.3
      - run: python stock_historical_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-historical-backtest
          path: backtest_output/
          if-no-files-found: warn
